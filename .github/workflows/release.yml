name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          python -m pytest tests/ -v

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    # `environment` gates the job behind whatever reviewers or branch rules the
    # pypi environment carries, and scopes the OIDC identity to that name.
    environment: pypi
    permissions:
      # Trusted Publishing mints a short-lived OIDC token for this one job
      # instead of keeping a long-lived PyPI API token in repository secrets.
      # Configure the publisher at https://pypi.org/manage/account/publishing/
      # for workflow `release.yml` and environment `pypi`, then delete the
      # PYPI_API_TOKEN secret.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: |
          python -m build

      - name: Check package
        run: |
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
